plugins { id 'com.android.application' }

android {
    namespace 'moe.xWey10.tiling'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'moe.xWey10.tiling'
        minSdk 33
        targetSdk 35
        versionCode 30
        versionName '0.12.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    //noinspection GradleDependency -- These versions support the project's compileSdk 35.
    implementation 'com.google.android.material:material:1.12.0'
    //noinspection GradleDependency -- Pinned alongside Material Components for API 35.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    compileOnly files('libs/xposed-api-82.jar')
    testImplementation files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
